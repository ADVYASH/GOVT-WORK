<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Music</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at center,
            #202025 0%,
            #0b0b0f 65%
        );

    color: white;
}


/* ================================
   PAGE
================================ */

.page {

    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

}

.content h1 {

    margin: 0;

    font-size: clamp(
        40px,
        7vw,
        80px
    );

    letter-spacing: -3px;

}

.content p {

    margin-top: 12px;

    color: #888;

}


/* ================================
   PLAYER
================================ */

.player {

    position: fixed;

    left: 50%;
    bottom: 24px;

    transform: translateX(-50%);

    width: min(
        600px,
        calc(100% - 30px)
    );

    min-height: 82px;

    padding: 12px 16px;

    display: flex;
    align-items: center;

    gap: 14px;

    background:
        rgba(25, 25, 30, .95);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 20px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(20px);

    z-index: 100;

}


/* ================================
   ART
================================ */

.art {

    width: 52px;
    height: 52px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #ff0055,
            #7b2cff
        );

    font-size: 24px;

}


/* ================================
   INFORMATION
================================ */

.info {

    flex: 1;

    min-width: 0;

    text-align: left;

}

.title {

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 8px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* ================================
   PROGRESS
================================ */

.progress {

    position: relative;

    width: 100%;

    height: 5px;

    background: #414147;

    border-radius: 20px;

    cursor: pointer;

}

.progress-fill {

    position: absolute;

    left: 0;
    top: 0;

    width: 0%;

    height: 100%;

    background: white;

    border-radius: inherit;

}


/* ================================
   CONTROLS
================================ */

.controls {

    display: flex;

    align-items: center;

    gap: 3px;

}

button {

    width: 40px;
    height: 40px;

    border: none;

    border-radius: 50%;

    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 17px;

}

button:hover {

    background:
        rgba(255,255,255,.1);

}

.play {

    width: 46px;
    height: 46px;

    background: white;

    color: black;

    font-size: 18px;

}

.play:hover {

    background: #eeeeee;

}


/* ================================
   TIME
================================ */

.time {

    position: absolute;

    left: 82px;

    bottom: 5px;

    font-size: 9px;

    color: #777;

}


/* ================================
   MOBILE
================================ */

@media(max-width:600px) {

    .player {

        bottom: 12px;

        width:
            calc(100% - 20px);

        padding:
            9px 10px;

        gap: 9px;

    }

    .art {

        width: 44px;
        height: 44px;

        border-radius: 11px;

    }

    .controls button:not(.play) {

        display: none;

    }

    .time {

        left: 64px;

    }

}

</style>

</head>


<body>


<!-- ================================
     PAGE
================================ -->

<div class="page">

    <div class="content">

        <h1>My Music</h1>

        <p>
            Your website content goes here.
        </p>

    </div>

</div>


<!-- ================================
     AUDIO PLAYER
================================ -->

<audio
    id="audio"
    preload="metadata"
></audio>


<!-- ================================
     CUSTOM PLAYER
================================ -->

<div class="player">


    <div class="art">
        ♫
    </div>


    <div class="info">

        <div
            class="title"
            id="title"
        >
            Select a song
        </div>


        <div
            class="progress"
            id="progress"
        >

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

        </div>


        <div class="time">

            <span id="current">
                0:00
            </span>

            /

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <div class="controls">


        <button
            id="previous"
            title="Previous"
        >
            ⏮
        </button>


        <button
            id="play"
            class="play"
            title="Play"
        >
            ▶
        </button>


        <button
            id="next"
            title="Next"
        >
            ⏭
        </button>


    </div>

</div>


<script>

/* =========================================
   YOUR MUSIC FILES

   Put these files inside:

   music/

   Example:

   music/song1.mp3
   music/song2.mp3
   music/song3.mp3
========================================= */

const songs = [];

for (let i = 1; i <= 100; i++) {

    const number =
        String(i).padStart(2, "0");

    songs.push({
        title: "Song " + i,
        file: "dululu/song" + number + ".mp3"
    });

}


/* =========================================
   ELEMENTS
========================================= */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("play");

const previousButton =
    document.getElementById("previous");

const nextButton =
    document.getElementById("next");

const title =
    document.getElementById("title");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const currentTime =
    document.getElementById("current");

const duration =
    document.getElementById("duration");


let currentSong = 0;


/* =========================================
   LOAD SONG
========================================= */

function loadSong(index) {

    currentSong = index;

    const song =
        songs[currentSong];

    title.textContent =
        song.title;

    audio.src =
        song.file;

    audio.load();

}


/* =========================================
   PLAY
========================================= */

function playSong() {

    audio.play()
        .then(() => {

            playButton.textContent =
                "❚❚";

        })
        .catch(error => {

            console.error(
                "Could not play:",
                error
            );

            title.textContent =
                "MP3 file not found";

        });

}


/* =========================================
   PAUSE
========================================= */

function pauseSong() {

    audio.pause();

    playButton.textContent =
        "▶";

}


/* =========================================
   PLAY BUTTON
========================================= */

playButton.addEventListener(
    "click",
    function() {

        if (audio.paused) {

            playSong();

        } else {

            pauseSong();

        }

    }
);


/* =========================================
   NEXT
========================================= */

nextButton.addEventListener(
    "click",
    function() {

        currentSong++;

        if (
            currentSong >=
            songs.length
        ) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    }
);


/* =========================================
   PREVIOUS
========================================= */

previousButton.addEventListener(
    "click",
    function() {

        currentSong--;

        if (
            currentSong < 0
        ) {

            currentSong =
                songs.length - 1;

        }

        loadSong(currentSong);

        playSong();

    }
);


/* =========================================
   AUTO NEXT
========================================= */

audio.addEventListener(
    "ended",
    function() {

        currentSong++;

        if (
            currentSong >=
            songs.length
        ) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    }
);


/* =========================================
   UPDATE PROGRESS
========================================= */

audio.addEventListener(
    "timeupdate",
    function() {

        if (
            !audio.duration
        ) {

            return;

        }


        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progressFill.style.width =
            percentage + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================
   DURATION
========================================= */

audio.addEventListener(
    "loadedmetadata",
    function() {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =========================================
   CLICK PROGRESS BAR
========================================= */

progress.addEventListener(
    "click",
    function(event) {

        if (
            !audio.duration
        ) {

            return;

        }


        const rect =
            progress.getBoundingClientRect();


        const percentage =
            (
                event.clientX -
                rect.left
            ) / rect.width;


        audio.currentTime =
            percentage *
            audio.duration;

    }
);


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(seconds) {

    if (
        isNaN(seconds)
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(secs).padStart(
            2,
            "0"
        )
    );

}


/* =========================================
   START WITH FIRST SONG
========================================= */

loadSong(0);

</script>


</body>
</html>
